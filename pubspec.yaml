name: muxify
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  go_router: ^14.6.2
  equatable: ^2.0.7
  intl: ^0.19.0
  http: ^1.2.2
  shared_preferences: ^2.3.3
  flutter_screenutil: ^5.9.3
  pinput: ^5.0.1
  local_auth: ^2.3.0
  fluttertoast: ^9.0.0
  shimmer: ^3.0.0
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  # Explicit so Android/iOS registrars link `path_provider` (required by `flutter_cache_manager`).
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/pngs/
    #- assets/jpegs/
    #- assets/svgs/
    #- assets/lotties/

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-VariableFont_wght.ttf
    - family: Luckiest Guy
      fonts:
        - asset: assets/fonts/LuckiestGuy-Regular.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-VariableFont_opsz,wght.ttf